stages:
  train:
    cmd: python mlflow/train.py
    deps:
      - data/diabetes_binary_health_indicators_BRFSS2015.csv
      - mlflow/train.py
    outs:
      - mlflow/model.pkl
    metrics:
      - mlflow/metrics.json:
          cache: false

